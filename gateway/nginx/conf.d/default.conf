# Routing table for the AURA gateway.
#
# Design notes for learners:
#  * We resolve upstream hostnames at REQUEST time via Docker's embedded DNS
#    (127.0.0.11) instead of at startup. That means NGINX boots even if a
#    service is still starting, and it transparently load-balances across new
#    replicas when you run `docker compose up --scale user-service=3`.
#  * To do request-time resolution you must put the upstream in a variable and
#    `proxy_pass $var`. As a bonus, NGINX then forwards the original request URI
#    unchanged, so /api/v1/auth/register reaches the service as-is.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80 default_server;
    server_name _;

    # --- Common proxy settings (inherited by every location below) ---------
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Generate/forward a request id so it shows up in every service's logs.
    proxy_set_header X-Request-ID      $request_id;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    # --- Gateway's own health endpoint -------------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"data":{"status":"ok","gateway":"nginx"}}';
    }

    # --- User service ------------------------------------------------------
    # Auth (register/login/refresh) and user profile endpoints.
    location /api/v1/auth/ {
        set $user_service http://user-service:8080;
        proxy_pass $user_service;
    }
    location /api/v1/users/ {
        set $user_service http://user-service:8080;
        proxy_pass $user_service;
    }

    # --- Product catalog service -------------------------------------------
    location /api/v1/products {
        set $product_service http://product-service:8080;
        proxy_pass $product_service;
    }

    # --- Cart service ------------------------------------------------------
    location /api/v1/cart {
        set $cart_service http://cart-service:8080;
        proxy_pass $cart_service;
    }

    # --- Order service -----------------------------------------------------
    location /api/v1/orders {
        set $order_service http://order-service:8080;
        proxy_pass $order_service;
    }

    # --- Payment service ---------------------------------------------------
    location /api/v1/payments {
        set $payment_service http://payment-service:8080;
        proxy_pass $payment_service;
    }

    # --- Notification service ----------------------------------------------
    location /api/v1/notifications {
        set $notification_service http://notification-service:8080;
        proxy_pass $notification_service;
    }

    # --- Storefront (Next.js) ----------------------------------------------
    # Anything that isn't an API call goes to the React frontend. This stays
    # last so the /api/* rules win.
    location / {
        set $web http://web:3000;
        proxy_pass $web;
    }
}
