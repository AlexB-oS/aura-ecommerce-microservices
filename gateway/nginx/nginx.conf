# Top-level NGINX config for the AURA API gateway.
# The gateway is the single public entrypoint: the browser only ever talks to
# this on http://localhost:8080, and NGINX routes each path to the right
# microservice (or to the Next.js frontend). Putting everything behind one
# origin also means the frontend's API calls are same-origin — no CORS in the
# browser to fight with.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Structured-ish access log including the request id we forward downstream,
    # so a request can be traced from the gateway into each service's logs.
    log_format main '$remote_addr - [$time_iso8601] "$request" '
                    'status=$status bytes=$body_bytes_sent '
                    'rid=$request_id rt=$request_time upstream=$upstream_addr';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;            # don't advertise the NGINX version

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/json application/javascript
                    application/xml image/svg+xml;

    client_max_body_size 5m;        # cap upload size at the edge

    # Required for proxying WebSockets (Next.js dev HMR, future realtime).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Per-service routing lives in conf.d/default.conf.
    include /etc/nginx/conf.d/*.conf;
}
