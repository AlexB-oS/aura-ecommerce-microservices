# AURA e-commerce platform — local orchestration (lean core).
#
# Bring the whole stack up with:   make up        (or: docker compose up --build)
# Then open the storefront at:      http://localhost:8080
#
# Topology:
#   browser ──> nginx (gateway) ──> web (Next.js)      for pages
#                              └──> user-service        for /api/v1/{auth,users}
#   user-service ──> user-postgres   (its own database)
#   user-service ──> nats            (publishes events)
#   redis & nats are shared infrastructure ready for the next services.
#
# Each service that you add later gets: its own container, (optionally) its own
# database, a route in gateway/nginx/conf.d/default.conf, and an entry here.

name: aura

services:
  # ----------------------------------------------------------------- gateway
  gateway:
    image: nginx:1.27-alpine
    container_name: aura-gateway
    depends_on:
      - web
      - user-service
      - product-service
      - cart-service
      - order-service
      - payment-service
      - notification-service
    ports:
      - "8080:80"            # the ONE public port; everything goes through here
    volumes:
      - ./gateway/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/nginx/conf.d:/etc/nginx/conf.d:ro
    restart: unless-stopped
    networks: [aura]

  # ------------------------------------------------------------ user service
  user-service:
    build:
      context: .                                # repo root: needs go.mod + pkg/
      dockerfile: services/user/Dockerfile
    container_name: aura-user-service
    environment:
      SERVICE_NAME: user-service
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://aura:${USER_DB_PASSWORD:-aura_dev}@user-postgres:5432/users?sslmode=disable
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your .env file}
      JWT_ISSUER: aura.auth
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 168h                     # 7 days
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-*}
    depends_on:
      user-postgres:
        condition: service_healthy
      nats:
        condition: service_started
    restart: unless-stopped
    networks: [aura]
    # No host port is published on purpose: the service is reached only through
    # the gateway. That also lets you scale it freely:
    #   docker compose up -d --scale user-service=3

  user-postgres:
    image: postgres:16-alpine
    container_name: aura-user-postgres
    environment:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-aura_dev}
      POSTGRES_DB: users
    volumes:
      - user_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura -d users"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [aura]

  # --------------------------------------------------------- product service
  product-service:
    build:
      context: .
      dockerfile: services/product/Dockerfile
    container_name: aura-product-service
    environment:
      SERVICE_NAME: product-service
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://aura:${PRODUCT_DB_PASSWORD:-aura_dev}@product-postgres:5432/products?sslmode=disable
      NATS_URL: nats://nats:4222
      # Same secret as the user service so this service can verify admin tokens.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your .env file}
      JWT_ISSUER: aura.auth
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-*}
    depends_on:
      product-postgres:
        condition: service_healthy
      nats:
        condition: service_started
    restart: unless-stopped
    networks: [aura]
    # Reached only through the gateway; scale freely:
    #   docker compose up -d --scale product-service=3

  product-postgres:
    image: postgres:16-alpine
    container_name: aura-product-postgres
    environment:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: ${PRODUCT_DB_PASSWORD:-aura_dev}
      POSTGRES_DB: products
    volumes:
      - product_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura -d products"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [aura]

  # ------------------------------------------------------------ cart service
  cart-service:
    build:
      context: .
      dockerfile: services/cart/Dockerfile
    container_name: aura-cart-service
    environment:
      SERVICE_NAME: cart-service
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_URL: redis://redis:6379/0
      PRODUCT_SERVICE_URL: http://product-service:8080
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your .env file}
      JWT_ISSUER: aura.auth
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-*}
    depends_on:
      redis:
        condition: service_healthy
      product-service:
        condition: service_started
    restart: unless-stopped
    networks: [aura]

  # ----------------------------------------------------------- order service
  order-service:
    build:
      context: .
      dockerfile: services/order/Dockerfile
    container_name: aura-order-service
    environment:
      SERVICE_NAME: order-service
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://aura:${ORDER_DB_PASSWORD:-aura_dev}@order-postgres:5432/orders?sslmode=disable
      NATS_URL: nats://nats:4222
      CART_SERVICE_URL: http://cart-service:8080
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your .env file}
      JWT_ISSUER: aura.auth
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-*}
    depends_on:
      order-postgres:
        condition: service_healthy
      nats:
        condition: service_started
      cart-service:
        condition: service_started
    restart: unless-stopped
    networks: [aura]

  order-postgres:
    image: postgres:16-alpine
    container_name: aura-order-postgres
    environment:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:-aura_dev}
      POSTGRES_DB: orders
    volumes:
      - order_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura -d orders"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [aura]

  # --------------------------------------------------------- payment service
  payment-service:
    build:
      context: .
      dockerfile: services/payment/Dockerfile
    container_name: aura-payment-service
    environment:
      SERVICE_NAME: payment-service
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://aura:${PAYMENT_DB_PASSWORD:-aura_dev}@payment-postgres:5432/payments?sslmode=disable
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your .env file}
      JWT_ISSUER: aura.auth
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-*}
    depends_on:
      payment-postgres:
        condition: service_healthy
      nats:
        condition: service_started
    restart: unless-stopped
    networks: [aura]

  payment-postgres:
    image: postgres:16-alpine
    container_name: aura-payment-postgres
    environment:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:-aura_dev}
      POSTGRES_DB: payments
    volumes:
      - payment_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura -d payments"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [aura]

  # ---------------------------------------------------- notification service
  notification-service:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    container_name: aura-notification-service
    environment:
      SERVICE_NAME: notification-service
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NATS_URL: nats://nats:4222
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-*}
    depends_on:
      nats:
        condition: service_started
    restart: unless-stopped
    networks: [aura]

  # ---------------------------------------------------- shared infrastructure
  # Redis is here ready for the Shopping Cart service (fast, ephemeral carts).
  redis:
    image: redis:7-alpine
    container_name: aura-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [aura]

  # NATS is the async event bus. -js enables JetStream (durable streams) for
  # when you want at-least-once delivery; -m 8222 exposes a monitoring UI.
  # No healthcheck: the NATS image is built FROM scratch (no shell), and our
  # services reconnect forever anyway, so a missing broker self-heals.
  nats:
    image: nats:2.10-alpine
    container_name: aura-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "8222:8222"          # NATS monitoring dashboard (optional, handy in dev)
    restart: unless-stopped
    networks: [aura]

  # ------------------------------------------------------------- storefront
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: aura-web
    environment:
      # The browser calls the API through the gateway at the same origin, so the
      # frontend uses relative URLs and needs no absolute API host.
      NODE_ENV: production
    depends_on:
      - user-service
      - product-service
    restart: unless-stopped
    networks: [aura]

volumes:
  user_pgdata:
  product_pgdata:
  order_pgdata:
  payment_pgdata:
  redis_data:

networks:
  aura:
    driver: bridge
